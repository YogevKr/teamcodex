name: CI
on: [push, pull_request]

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @openai/codex@0.153.4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Test Codex tool cycle
        # Ubuntu runners block bubblewrap user namespaces. This test runs only
        # a fixed printf command from a local mock in a temporary workspace.
        run: |
          python3 scripts/e2e.py --sandbox ${{ runner.os == 'Linux' && 'danger-full-access' || 'workspace-write' }}
          python3 scripts/e2e.py --model-unavailable --sandbox ${{ runner.os == 'Linux' && 'danger-full-access' || 'workspace-write' }}
      - run: python3 scripts/tui_e2e.py
